[project]
name = "futurecv-ai"
version = "0.1.0"
description = "FutureCV — Backend AI Service (CV Analyzer, Job Matching, CV Improvement, Career Assistant, Candidate Ranking)"
requires-python = ">=3.11"
readme = "README.md"

# ═══════════════════════════════════════════════════════════
# Ruff — Linter & Formatter (thay thế flake8 + isort + black)
# ═══════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]
exclude = [".venv", "venv", "__pycache__", ".git", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import ordering)
    "N",     # pep8-naming
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ANN",   # flake8-annotations (type hints required)
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "RUF",   # Ruff-specific rules
]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "S101",    # Use of `assert` detected (OK in tests)
    "B008",    # Do not perform function call in argument defaults (FastAPI Depends)
    "ARG002",  # Unused method argument (common in ABC overrides)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",     # Type hints not required in tests
    "S101",    # assert OK in tests
    "ARG",     # Unused args OK in fixtures
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ═══════════════════════════════════════════════════════════
# MyPy — Static Type Checker
# ═══════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fitz", "google.*"]
ignore_missing_imports = true

# ═══════════════════════════════════════════════════════════
# Pytest
# ═══════════════════════════════════════════════════════════
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
